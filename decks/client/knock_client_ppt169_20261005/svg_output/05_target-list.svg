      <text x="440" y="286">WHERE</text>
      <text x="580" y="286">THE SHARED REASON TO TALK</text>
      <text x="1010" y="286">STATUS</text>
    </g>
    <line x1="72" y1="298" x2="1208" y2="298" stroke="#0E1F3A" stroke-width="2"/>
    <g id="target-row-1">
      <text x="72" y="344" font-family="Arial Narrow" font-size="24" font-weight="bold" fill="#0E1F3A">Hiring manager, Product</text>
      <text x="440" y="344" font-size="22" fill="#0E1F3A">Zepto</text>
      <text x="580" y="334" font-size="21" fill="#2B4266">Both started in FMCG brand roles<tspan x="580" dy="28">before product</tspan></text>
      <circle cx="1020" cy="338" r="5" fill="#0E1F3A"/>
      <text x="1036" y="344" font-family="Arial" font-size="13" fill="#0E1F3A">Message drafted for you</text>
      <line x1="72" y1="378" x2="1208" y2="378" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    </g>
    <g id="target-row-2">
      <text x="72" y="424" font-family="Arial Narrow" font-size="24" font-weight="bold" fill="#0E1F3A">Product manager, Growth</text>
      <text x="440" y="424" font-size="22" fill="#0E1F3A">Zepto</text>
      <text x="580" y="424" font-size="21" fill="#2B4266">Same college, three batches apart</text>
      <circle cx="1020" cy="418" r="5" fill="#0E1F3A"/>
      <text x="1036" y="424" font-family="Arial" font-size="13" fill="#0E1F3A">Message drafted for you</text>
      <line x1="72" y1="458" x2="1208" y2="458" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    </g>
    <g id="target-row-3">
      <text x="72" y="504" font-family="Arial Narrow" font-size="24" font-weight="bold" fill="#0E1F3A">Senior PM, Quick commerce</text>
      <text x="440" y="504" font-size="22" fill="#0E1F3A">Blinkit</text>
      <text x="580" y="494" font-size="21" fill="#2B4266">Wrote about a launch you worked on as a<tspan x="580" dy="28">brand manager</tspan></text>
      <circle cx="1020" cy="498" r="5" fill="none" stroke="#4A5F80" stroke-width="2"/>
      <text x="1036" y="504" font-family="Arial" font-size="13" fill="#4A5F80">Researching</text>
      <line x1="72" y1="538" x2="1208" y2="538" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    </g>
