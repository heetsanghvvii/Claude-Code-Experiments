<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" data-pptx-page-role="content" font-family="Arial">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F6F2EA"/>

  <g id="header" data-pptx-bounds="64 44 1152 136">
    <text x="64" y="74" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">07  THE PARTNERSHIP OFFER</text>
    <text x="64" y="128" font-family="Georgia" font-size="40" fill="#1D2624">Four things for your members. Two small asks.</text>
    <text x="64" y="166" font-size="20" fill="#5C6461">Most of the value goes to the club and its students.</text>
  </g>

  <g id="club-gets" data-pptx-bounds="64 200 780 446">
    <rect x="64" y="204" width="780" height="438" rx="6" fill="#16302B"/>
    <text x="100" y="252" font-size="15" font-weight="bold" letter-spacing="2" fill="#C9A063">WHAT &lt;CLUB NAME&gt; GETS</text>
    <g id="gets-1">
      <text x="100" y="320" font-family="Georgia" font-size="34" fill="#C9A063">01</text>
      <text x="100" y="360" font-size="21" font-weight="bold" fill="#F6F2EA">Founding price</text>
      <text x="100" y="390" font-size="18" fill="#C8CFC9">for every member, on
        <tspan x="100" dy="26">every package.</tspan></text>
    </g>
    <g id="gets-2">
      <text x="472" y="320" font-family="Georgia" font-size="34" fill="#C9A063">02</text>
      <text x="472" y="360" font-size="21" font-weight="bold" fill="#F6F2EA">A free pilot</text>
      <text x="472" y="390" font-size="18" fill="#C8CFC9">for 5 students chosen
        <tspan x="472" dy="26">by the club.</tspan></text>
    </g>
    <line x1="100" y1="448" x2="808" y2="448" stroke="#2F5A50" stroke-width="1"/>
    <g id="gets-3">
      <text x="100" y="506" font-family="Georgia" font-size="34" fill="#C9A063">03</text>
      <text x="100" y="546" font-size="21" font-weight="bold" fill="#F6F2EA">A results summary</text>
      <text x="100" y="576" font-size="18" fill="#C8CFC9">the club can share with
        <tspan x="100" dy="26">its batch and faculty.</tspan></text>
    </g>
    <g id="gets-4">
      <text x="472" y="506" font-family="Georgia" font-size="34" fill="#C9A063">04</text>
      <text x="472" y="546" font-size="21" font-weight="bold" fill="#F6F2EA">A co-hosted session</text>
      <text x="472" y="576" font-size="18" fill="#C8CFC9">on outbound job search,
        <tspan x="472" dy="26">open to the batch.</tspan></text>
    </g>
  </g>

  <g id="knock-asks" data-pptx-bounds="876 200 340 446">
    <rect x="876" y="204" width="340" height="438" rx="6" fill="none" stroke="#A8743A" stroke-width="1.5"/>
    <text x="908" y="252" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">WHAT KNOCK ASKS</text>
    <g id="asks-1">
      <text x="908" y="320" font-family="Georgia" font-size="34" fill="#A8743A">01</text>
      <text x="908" y="360" font-size="21" font-weight="bold" fill="#1D2624">One announcement</text>
      <text x="908" y="390" font-size="18" fill="#5C6461">to the batch, in the
        <tspan x="908" dy="26">club's own words.</tspan></text>
    </g>
    <line x1="908" y1="448" x2="1184" y2="448" stroke="#D9CFBF" stroke-width="1"/>
    <g id="asks-2">
      <text x="908" y="506" font-family="Georgia" font-size="34" fill="#A8743A">02</text>
      <text x="908" y="546" font-size="21" font-weight="bold" fill="#1D2624">One feedback call</text>
      <text x="908" y="576" font-size="18" fill="#5C6461">after the pilot. Honest
        <tspan x="908" dy="26">views shape the service.</tspan></text>
    </g>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 662 1152 40">
    <text x="64" y="690" font-family="Georgia" font-size="17" fill="#16302B">Knock</text>
    <text x="126" y="689" font-size="13" fill="#5C6461">Partner proposal for &lt;Club name&gt;</text>
    <rect x="1178" y="674" width="11" height="18" rx="2" fill="none" stroke="#A8743A" stroke-width="1.5"/>
    <text x="1216" y="690" font-family="Georgia" font-size="17" fill="#16302B" text-anchor="end">08</text>
  </g>
</svg>
