  <g id="chev-labels" data-pptx-bounds="64 204 1152 40" font-family="Arial" font-size="17" font-weight="bold" fill="#FAFCFE" text-anchor="middle">
    <text x="182" y="226">Hook</text>
    <text x="411" y="226">Writers</text>
    <text x="640" y="226">Rule checks</text>
    <text x="869" y="226">Judge</text>
    <text x="1098" y="226">You approve</text>
  </g>
  <g id="chev-captions" data-pptx-bounds="64 256 1152 26" font-size="15" font-style="italic" fill="#2B4266">
    <text x="82" y="274">A cited fact from both profiles</text>
    <text x="311" y="274">Several drafts, different angles</text>
    <text x="540" y="274">Length, phrases, one question</text>
    <text x="769" y="274">Scores drafts against a rubric</text>
    <text x="998" y="274">Nothing sends without a yes</text>
  </g>
  <g id="loop-label" data-pptx-bounds="64 284 400 18"><text x="64" y="298" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="3" fill="#4A5F80">THE LEARNING LOOP</text></g>
  <g id="loop-writer" data-pptx-bounds="64 304 270 116">
    <rect x="64" y="304" width="270" height="116" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.25" stroke-width="1"/>
    <text x="80" y="336" font-family="Arial" font-size="17" font-weight="bold" fill="#0E1F3A">Writer selection</text>
    <text x="80" y="362" font-size="16" fill="#2B4266">Drafts that get approved raise<tspan x="80" dy="22">that writer's odds of being</tspan><tspan x="80" dy="22">chosen next time.</tspan></text>
  </g>
  <g id="loop-playbook" data-pptx-bounds="430 304 270 116">
    <rect x="430" y="304" width="270" height="116" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.25" stroke-width="1"/>
    <text x="446" y="336" font-family="Arial" font-size="17" font-weight="bold" fill="#0E1F3A">Playbook from edits</text>
    <text x="446" y="362" font-size="16" fill="#2B4266">Every edit by the founder or<tspan x="446" dy="22">the candidate is distilled into</tspan><tspan x="446" dy="22">rules the writers follow.</tspan></text>
  </g>
  <g id="loop-judge" data-pptx-bounds="430 504 270 116">
    <rect x="430" y="504" width="270" height="116" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.25" stroke-width="1"/>
    <text x="446" y="536" font-family="Arial" font-size="17" font-weight="bold" fill="#0E1F3A">Judge calibration</text>
    <text x="446" y="562" font-size="16" fill="#2B4266">When a human overrides the<tspan x="446" dy="22">judge, its taste is adjusted</tspan><tspan x="446" dy="22">to match.</tspan></text>
  </g>
  <g id="loop-replies" data-pptx-bounds="64 504 270 116">
    <rect x="64" y="504" width="270" height="116" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.25" stroke-width="1"/>
    <text x="80" y="536" font-family="Arial" font-size="17" font-weight="bold" fill="#0E1F3A">Reply learning</text>
    <text x="80" y="562" font-size="16" fill="#2B4266">Which replies led to calls and<tspan x="80" dy="22">referrals shapes how the next</tspan><tspan x="80" dy="22">reply is drafted.</tspan></text>
  </g>
  <g id="drift-guards" data-pptx-bounds="740 296 476 344">
    <rect x="740" y="296" width="476" height="344" fill="#0E1F3A"/>
    <text x="772" y="340" font-family="Arial" font-size="24" font-weight="bold" fill="#EEF3F8">Guarding against drift</text>
    <text x="772" y="372" font-size="16" font-style="italic" fill="#A9C7E6">Self-learning can slide toward polished but generic.</text>
    <g font-size="18" fill="#BFD0E6">
      <text x="772" y="416">The rubric is a send gate: a message<tspan x="772" dy="24">that fails a hard rule never goes out.</tspan></text>
      <text x="772" y="478">A golden set of test prospects is re-run<tspan x="772" dy="24">after every playbook or writer change.</tspan></text>
      <text x="772" y="540">Playbooks are versioned, so any change<tspan x="772" dy="24">can be rolled back.</tspan></text>
      <text x="772" y="602">A weekly audit scores a random sample<tspan x="772" dy="24">of the messages that were sent.</tspan></text>
    </g>
  </g>
