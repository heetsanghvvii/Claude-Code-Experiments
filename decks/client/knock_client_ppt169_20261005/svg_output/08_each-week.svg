<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en-IN" font-family="Times New Roman" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#EEF3F8"/>
  <g id="header" data-pptx-bounds="72 48 1000 160">
    <rect x="72" y="52" width="44" height="6" fill="#B3301B"/>
    <text x="72" y="90" font-family="Arial" font-size="15" font-weight="bold" letter-spacing="2.4" fill="#4A5F80">WHAT YOU GET</text>
    <text x="72" y="140" font-family="Arial Narrow" font-size="44" font-weight="bold" fill="#0E1F3A">Each week: the list, the research,<tspan x="72" dy="52">the messages and a results report</tspan></text>
  </g>
  <g id="weekly-ledger" data-pptx-bounds="72 232 1136 392">
    <line x1="72" y1="232" x2="1208" y2="232" stroke="#0E1F3A" stroke-width="2"/>
    <g id="item-list">
      <text x="72" y="282" font-family="Arial Narrow" font-size="40" font-weight="bold" fill="#4A5F80">01</text>
      <text x="160" y="278" font-family="Arial Narrow" font-size="26" font-weight="bold" fill="#0E1F3A">Your target list</text>
      <text x="720" y="266" font-size="20" fill="#2B4266">The people worth writing to, each with a shared<tspan x="720" dy="26">reason to talk.</tspan></text>
    </g>
    <line x1="72" y1="310" x2="1208" y2="310" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <g id="item-research">
      <text x="72" y="360" font-family="Arial Narrow" font-size="40" font-weight="bold" fill="#4A5F80">02</text>
      <text x="160" y="356" font-family="Arial Narrow" font-size="26" font-weight="bold" fill="#0E1F3A">Research on every person</text>
      <text x="720" y="344" font-size="20" fill="#2B4266">Their path, their work and something you genuinely<tspan x="720" dy="26">share.</tspan></text>
    </g>
    <line x1="72" y1="388" x2="1208" y2="388" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <g id="item-messages">
      <text x="72" y="438" font-family="Arial Narrow" font-size="40" font-weight="bold" fill="#4A5F80">03</text>
      <text x="160" y="434" font-family="Arial Narrow" font-size="26" font-weight="bold" fill="#0E1F3A">Personal first messages</text>
      <text x="720" y="422" font-size="20" fill="#2B4266">Written for one reader each. Nothing goes out until<tspan x="720" dy="26">you approve it.</tspan></text>
    </g>
    <line x1="72" y1="466" x2="1208" y2="466" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <g id="item-replies">
      <text x="72" y="516" font-family="Arial Narrow" font-size="40" font-weight="bold" fill="#4A5F80">04</text>
      <text x="160" y="512" font-family="Arial Narrow" font-size="26" font-weight="bold" fill="#0E1F3A">Reply drafts for every conversation</text>
      <text x="720" y="500" font-size="20" fill="#2B4266">We draft your answers and steer each conversation<tspan x="720" dy="26">toward a referral or an interview.</tspan></text>
    </g>
    <line x1="72" y1="544" x2="1208" y2="544" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <g id="item-report">
      <text x="72" y="594" font-family="Arial Narrow" font-size="40" font-weight="bold" fill="#4A5F80">05</text>
      <text x="160" y="590" font-family="Arial Narrow" font-size="26" font-weight="bold" fill="#0E1F3A">A weekly results report</text>
      <text x="720" y="578" font-size="20" fill="#2B4266">A clear view each week of the people contacted and<tspan x="720" dy="26">the conversations underway.</tspan></text>
    </g>
    <line x1="72" y1="622" x2="1208" y2="622" stroke="#0E1F3A" stroke-width="2"/>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="72 660 1136 46">
    <line x1="72" y1="668" x2="1208" y2="668" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <text x="72" y="696" font-family="Arial Narrow" font-size="20" font-weight="bold" fill="#0E1F3A">Knock</text>
    <text x="1208" y="696" text-anchor="end" font-family="Arial" font-size="14" fill="#4A5F80">08 / 12</text>
  </g>
</svg>
