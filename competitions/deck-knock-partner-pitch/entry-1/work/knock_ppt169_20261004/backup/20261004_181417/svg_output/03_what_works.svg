<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" data-pptx-page-role="content" font-family="Arial">
  <defs>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9AE9C"/>
    </marker>
    <marker id="arrowBrass" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#C9A063"/>
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F6F2EA"/>

  <g id="header" data-pptx-bounds="64 44 1152 136">
    <text x="64" y="74" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">02  WHAT ALREADY WORKS</text>
    <text x="64" y="128" font-family="Georgia" font-size="40" fill="#1D2624">Warm conversations open doors that forms do not.</text>
    <text x="64" y="166" font-size="20" fill="#5C6461">Referrals and introductions are read with far more attention than cold applications.</text>
  </g>

  <g id="cold-path" data-pptx-bounds="64 200 540 446">
    <rect x="64" y="204" width="540" height="438" rx="6" fill="#EDE6D8"/>
    <text x="100" y="254" font-size="15" font-weight="bold" letter-spacing="2" fill="#5C6461">COLD APPLICATION</text>
    <g id="cold-steps" font-size="21" fill="#5C6461">
      <circle cx="112" cy="310" r="8" fill="none" stroke="#B9AE9C" stroke-width="2"/>
      <text x="140" y="317">A form submitted to a portal</text>
      <line x1="112" y1="326" x2="112" y2="370" stroke="#B9AE9C" stroke-width="2" marker-end="url(#arrowMuted)"/>
      <circle cx="112" cy="390" r="8" fill="none" stroke="#B9AE9C" stroke-width="2"/>
      <text x="140" y="397">Screened by keywords</text>
      <line x1="112" y1="406" x2="112" y2="450" stroke="#B9AE9C" stroke-width="2" marker-end="url(#arrowMuted)"/>
      <circle cx="112" cy="470" r="8" fill="none" stroke="#B9AE9C" stroke-width="2"/>
      <text x="140" y="477">Waits in a long queue</text>
      <line x1="112" y1="486" x2="112" y2="530" stroke="#B9AE9C" stroke-width="2" marker-end="url(#arrowMuted)"/>
      <circle cx="112" cy="550" r="8" fill="#B9AE9C"/>
      <text x="140" y="557" font-style="italic">Often, no reply at all</text>
    </g>
  </g>

  <g id="warm-path" data-pptx-bounds="644 200 572 446">
    <rect x="644" y="204" width="572" height="438" rx="6" fill="#16302B"/>
    <text x="680" y="254" font-size="15" font-weight="bold" letter-spacing="2" fill="#C9A063">WARM CONVERSATION</text>
    <g id="warm-steps" font-size="21" fill="#F6F2EA">
      <circle cx="692" cy="310" r="8" fill="#C9A063"/>
      <text x="720" y="317">A note to a real person</text>
      <line x1="692" y1="326" x2="692" y2="370" stroke="#C9A063" stroke-width="2" marker-end="url(#arrowBrass)"/>
      <circle cx="692" cy="390" r="8" fill="#C9A063"/>
      <text x="720" y="397">A genuine reason to talk</text>
      <line x1="692" y1="406" x2="692" y2="450" stroke="#C9A063" stroke-width="2" marker-end="url(#arrowBrass)"/>
      <circle cx="692" cy="470" r="8" fill="#C9A063"/>
      <text x="720" y="477">A real conversation</text>
      <line x1="692" y1="486" x2="692" y2="530" stroke="#C9A063" stroke-width="2" marker-end="url(#arrowBrass)"/>
      <circle cx="692" cy="550" r="11" fill="#C9A063"/>
      <text x="720" y="557" font-weight="bold" fill="#E9C98C">A referral or an interview</text>
    </g>
    <text x="680" y="614" font-size="16" fill="#C8CFC9">Someone inside vouches for you. That changes how you are read.</text>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 662 1152 40">
    <text x="64" y="690" font-family="Georgia" font-size="17" fill="#16302B">Knock</text>
    <text x="126" y="689" font-size="13" fill="#5C6461">Partner proposal for &lt;Club name&gt;</text>
    <rect x="1178" y="674" width="11" height="18" rx="2" fill="none" stroke="#A8743A" stroke-width="1.5"/>
    <text x="1216" y="690" font-family="Georgia" font-size="17" fill="#16302B" text-anchor="end">03</text>
  </g>
</svg>
