  <g id="close-headline" data-pptx-bounds="80 90 860 222">
    <text x="80" y="120" font-family="Arial" font-size="15" font-weight="bold" letter-spacing="3" fill="#2B4266">NEXT STEP</text>
    <text x="80" y="204" font-family="Arial Narrow" font-size="72" font-weight="bold" fill="#0E1F3A">Tell us where you<tspan x="80" dy="80">want to work.</tspan></text>
  </g>
  <g id="close-sub" data-pptx-bounds="80 324 860 40">
    <text x="80" y="348" font-size="26" fill="#2B4266">Two minutes now. We come back with the people worth writing to.</text>
  </g>
  <g id="close-steps" data-pptx-bounds="80 386 860 140">
    <circle cx="94" cy="418" r="14" fill="#0E1F3A"/>
    <text x="94" y="423" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#FAFCFE">1</text>
    <text x="126" y="425" font-size="22" fill="#0E1F3A">We read your profile and your targets.</text>
    <circle cx="94" cy="462" r="14" fill="#0E1F3A"/>
    <text x="94" y="467" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#FAFCFE">2</text>
    <text x="126" y="469" font-size="22" fill="#0E1F3A">We email you a first look at your target list.</text>
    <circle cx="94" cy="506" r="14" fill="#0E1F3A"/>
    <text x="94" y="511" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#FAFCFE">3</text>
    <text x="126" y="513" font-size="22" fill="#0E1F3A">You choose a package only if it looks right.</text>
  </g>
