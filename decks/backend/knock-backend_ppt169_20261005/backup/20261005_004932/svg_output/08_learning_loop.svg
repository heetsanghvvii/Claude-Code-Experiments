<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" font-family="Times New Roman" data-pptx-page-role="content">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#0E1F3A"/></marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#EEF3F8"/>
  <g id="header" data-pptx-bounds="64 44 1090 112" font-family="Arial" font-weight="bold">
    <text x="64" y="60" font-size="13" fill="#4A5F80">SELF-LEARNING LOOP</text>
    <text x="64" y="102" font-size="34" fill="#0E1F3A">Every edit and every outcome feeds back, so the<tspan x="64" dy="40">writers, the judge and the reply agent improve</tspan></text>
  </g>
  <g id="page-stamp" data-pptx-bounds="1166 24 64 76">
    <rect x="1172" y="30" width="52" height="64" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.28" stroke-width="1"/>
    <rect x="1178" y="36" width="40" height="52" fill="#B3301B"/>
    <text x="1198" y="70" font-family="Arial" font-weight="bold" font-size="22" fill="#FAFCFE" text-anchor="middle">8</text>
  </g>
  <line id="perf" data-pptx-role="decoration" x1="64" y1="166" x2="1216" y2="166" stroke="#97B9DD" stroke-width="3" stroke-dasharray="2,7"/>

  <g id="signal-1" data-pptx-bounds="64 186 456 112">
    <rect x="64" y="186" width="406" height="112" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="64" y="186" width="6" height="112" fill="#0E1F3A"/>
    <text x="84" y="218" font-family="Arial" font-weight="bold" font-size="17" fill="#0E1F3A">Reply outcome</text>
    <text x="84" y="244" font-size="17" fill="#2B4266">An opener gets a reply, or does not.</text>
    <line x1="472" y1="242" x2="518" y2="242" stroke="#0E1F3A" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <g id="signal-2" data-pptx-bounds="64 306 456 112">
    <rect x="64" y="306" width="406" height="112" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="64" y="306" width="6" height="112" fill="#0E1F3A"/>
    <text x="84" y="338" font-family="Arial" font-weight="bold" font-size="17" fill="#0E1F3A">Operator edit</text>
    <text x="84" y="364" font-size="17" fill="#2B4266">The operator edits a draft before approving it.</text>
    <line x1="472" y1="362" x2="518" y2="362" stroke="#0E1F3A" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <g id="signal-3" data-pptx-bounds="64 426 456 112">
    <rect x="64" y="426" width="406" height="112" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="64" y="426" width="6" height="112" fill="#0E1F3A"/>
    <text x="84" y="458" font-family="Arial" font-weight="bold" font-size="17" fill="#0E1F3A">Judge override</text>
    <text x="84" y="484" font-size="17" fill="#2B4266">The operator picks an alternative over the<tspan x="84" dy="22">judge's pick.</tspan></text>
    <line x1="472" y1="482" x2="518" y2="482" stroke="#0E1F3A" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <g id="signal-4" data-pptx-bounds="64 546 456 112">
    <rect x="64" y="546" width="406" height="112" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="64" y="546" width="6" height="112" fill="#0E1F3A"/>
    <text x="84" y="578" font-family="Arial" font-weight="bold" font-size="17" fill="#0E1F3A">Conversation outcome</text>
    <text x="84" y="604" font-size="17" fill="#2B4266">A conversation reaches a referral or an<tspan x="84" dy="22">interview, or stalls.</tspan></text>
    <line x1="472" y1="602" x2="518" y2="602" stroke="#0E1F3A" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <g id="learn-step" data-pptx-bounds="520 186 290 472">
    <rect x="520" y="186" width="240" height="472" fill="#0E1F3A"/>
    <text x="536" y="224" font-family="Arial" font-weight="bold" font-size="24" fill="#FAFCFE">learn()</text>
    <g font-size="16" fill="#FAFCFE">
      <text x="536" y="258">Runs inside sync once ten<tspan x="536" dy="21">new signals have arrived.</tspan><tspan x="536" dy="21">The first playbook needs</tspan><tspan x="536" dy="21">five.</tspan></text>
      <text x="536" y="360">Stored once, across all<tspan x="536" dy="21">candidates, in the feedback</tspan><tspan x="536" dy="21">document, because what</tspan><tspan x="536" dy="21">works carries over.</tspan></text>
      <text x="536" y="468">At most five writers stay<tspan x="536" dy="21">active. A writer under half</tspan><tspan x="536" dy="21">the best reply rate after ten</tspan><tspan x="536" dy="21">sends retires.</tspan></text>
      <text x="536" y="590" font-style="italic" fill="#C4D9EF">The next generate and sync<tspan x="536" dy="21">read the updated rules.</tspan></text>
    </g>
    <line x1="762" y1="242" x2="808" y2="242" stroke="#0E1F3A" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="762" y1="362" x2="808" y2="362" stroke="#0E1F3A" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="762" y1="482" x2="808" y2="482" stroke="#0E1F3A" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="762" y1="602" x2="808" y2="602" stroke="#0E1F3A" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <g id="result-1" data-pptx-bounds="810 186 406 112">
    <rect x="810" y="186" width="406" height="112" fill="#C4D9EF"/>
    <text x="826" y="218" font-family="Arial" font-weight="bold" font-size="17" fill="#0E1F3A">Writer choice</text>
    <text x="826" y="244" font-size="16" fill="#0E1F3A">Thompson sampling per prospect bucket. Weak<tspan x="826" dy="21">writers retire. A new angle evolves from openers</tspan><tspan x="826" dy="21">that got replies.</tspan></text>
  </g>
  <g id="result-2" data-pptx-bounds="810 306 406 112">
    <rect x="810" y="306" width="406" height="112" fill="#C4D9EF"/>
    <text x="826" y="338" font-family="Arial" font-weight="bold" font-size="17" fill="#0E1F3A">Opener playbook</text>
    <text x="826" y="364" font-size="16" fill="#0E1F3A">Up to 15 short rules distilled from the edits, fed to<tspan x="826" dy="21">every writer and to the judge.</tspan></text>
  </g>
  <g id="result-3" data-pptx-bounds="810 426 406 112">
    <rect x="810" y="426" width="406" height="112" fill="#C4D9EF"/>
    <text x="826" y="458" font-family="Arial" font-weight="bold" font-size="17" fill="#0E1F3A">Judge calibration</text>
    <text x="826" y="484" font-size="16" fill="#0E1F3A">The five most recent overrides are shown to the<tspan x="826" dy="21">judge as examples of the operator's taste.</tspan></text>
  </g>
  <g id="result-4" data-pptx-bounds="810 546 406 112">
    <rect x="810" y="546" width="406" height="112" fill="#C4D9EF"/>
    <text x="826" y="578" font-family="Arial" font-weight="bold" font-size="17" fill="#0E1F3A">Reply playbook</text>
    <text x="826" y="604" font-size="16" fill="#0E1F3A">Up to 12 rules plus success rates per ask type, fed<tspan x="826" dy="21">to the reply agent.</tspan></text>
  </g>
  <g id="source" data-pptx-bounds="64 688 760 22" font-family="Arial" font-size="13" fill="#4A5F80">
    <text x="64" y="702">Source: engine/outreach/feedback.py (choose_writers, learn, _evolve_writers), docs/AUTOMATION.md</text>
  </g>
</svg>
