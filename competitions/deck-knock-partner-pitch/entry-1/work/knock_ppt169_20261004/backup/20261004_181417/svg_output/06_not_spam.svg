<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" data-pptx-page-role="content" font-family="Arial">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F6F2EA"/>

  <g id="header" data-pptx-bounds="64 44 1152 136">
    <text x="64" y="74" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">05  WHY IT IS NOT SPAM</text>
    <text x="64" y="128" font-family="Georgia" font-size="40" fill="#1D2624">Built to protect your batch's name, not to blast.</text>
    <text x="64" y="166" font-size="20" fill="#5C6461">Fewer, better conversations. Every one of them carries the student's name.</text>
  </g>

  <g id="hero-number" data-pptx-bounds="64 200 420 440">
    <rect x="64" y="204" width="420" height="432" rx="6" fill="#16302B"/>
    <text x="104" y="410" font-family="Georgia" font-size="190" fill="#C9A063">60</text>
    <text x="108" y="470" font-size="24" fill="#F6F2EA">hand-picked people
      <tspan x="108" dy="32">per student, per week</tspan></text>
    <line x1="108" y1="540" x2="168" y2="540" stroke="#C9A063" stroke-width="2"/>
    <text x="108" y="580" font-size="16" fill="#C8CFC9">Chosen one by one.
      <tspan x="108" dy="24">Never scraped in bulk.</tspan></text>
  </g>

  <g id="guardrails" data-pptx-bounds="532 200 684 440">
    <g id="rule-1">
      <text x="532" y="236" font-family="Georgia" font-size="22" fill="#A8743A">i</text>
      <text x="572" y="236" font-size="21" font-weight="bold" fill="#1D2624">Every message is personal</text>
      <text x="572" y="266" font-size="18" fill="#5C6461">No template with a name swapped in. Written for one person.</text>
    </g>
    <line x1="532" y1="300" x2="1216" y2="300" stroke="#D9CFBF" stroke-width="1"/>
    <g id="rule-2">
      <text x="532" y="346" font-family="Georgia" font-size="22" fill="#A8743A">ii</text>
      <text x="572" y="346" font-size="21" font-weight="bold" fill="#1D2624">Sent from the student's own account</text>
      <text x="572" y="376" font-size="18" fill="#5C6461">Only after they approve it. Nothing goes out in their name unseen.</text>
    </g>
    <line x1="532" y1="410" x2="1216" y2="410" stroke="#D9CFBF" stroke-width="1"/>
    <g id="rule-3">
      <text x="532" y="456" font-family="Georgia" font-size="22" fill="#A8743A">iii</text>
      <text x="572" y="456" font-size="21" font-weight="bold" fill="#1D2624">Well under LinkedIn's limits</text>
      <text x="572" y="486" font-size="18" fill="#5C6461">The pace stays human, so the account stays in good standing.</text>
    </g>
    <line x1="532" y1="520" x2="1216" y2="520" stroke="#D9CFBF" stroke-width="1"/>
    <g id="rule-4">
      <text x="532" y="566" font-family="Georgia" font-size="22" fill="#A8743A">iv</text>
      <text x="572" y="566" font-size="21" font-weight="bold" fill="#1D2624">Conversation first, the ask later</text>
      <text x="572" y="596" font-size="18" fill="#5C6461">A referral is requested only once there is a real exchange.</text>
    </g>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 662 1152 40">
    <text x="64" y="690" font-family="Georgia" font-size="17" fill="#16302B">Knock</text>
    <text x="126" y="689" font-size="13" fill="#5C6461">Partner proposal for &lt;Club name&gt;</text>
    <rect x="1178" y="674" width="11" height="18" rx="2" fill="none" stroke="#A8743A" stroke-width="1.5"/>
    <text x="1216" y="690" font-family="Georgia" font-size="17" fill="#16302B" text-anchor="end">06</text>
  </g>
</svg>
