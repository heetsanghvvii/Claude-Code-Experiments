    <text x="412" y="580" font-family="Arial" font-size="22" font-weight="bold" fill="#0E1F3A">knock-eosin-beta.vercel.app</text>
    <text x="412" y="610" font-size="22" fill="#2B4266">hello@knock.careers</text>
  </g>
  <g id="close-note" data-pptx-bounds="80 648 860 26">
