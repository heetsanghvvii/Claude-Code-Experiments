  <g id="step-1-desc" data-pptx-bounds="64 280 180 140">
    <text x="72" y="304" font-size="17" fill="#2B4266">Resume, profile,<tspan x="72" dy="24">target companies,</tspan><tspan x="72" dy="24">role titles and the</tspan><tspan x="72" dy="24">candidate's story.</tspan></text>
  </g>
  <g id="step-2-desc" data-pptx-bounds="253 280 180 140">
    <text x="261" y="304" font-size="17" fill="#2B4266">Hiring managers,<tspan x="261" dy="24">team members,</tspan><tspan x="261" dy="24">alumni and senior</tspan><tspan x="261" dy="24">connectors, found in</tspan><tspan x="261" dy="24">public search.</tspan></text>
  </g>
  <g id="step-3-desc" data-pptx-bounds="442 280 180 140">
    <text x="450" y="304" font-size="17" fill="#2B4266">Public posts, talks<tspan x="450" dy="24">and articles become</tspan><tspan x="450" dy="24">facts, each with a</tspan><tspan x="450" dy="24">source. A hook must</tspan><tspan x="450" dy="24">cite one.</tspan></text>
  </g>
  <g id="step-4-desc" data-pptx-bounds="631 280 180 140">
    <text x="639" y="304" font-size="17" fill="#2B4266">A short, personal<tspan x="639" dy="24">first message in the</tspan><tspan x="639" dy="24">candidate's voice,</tspan><tspan x="639" dy="24">built on the cited</tspan><tspan x="639" dy="24">hook.</tspan></text>
  </g>
  <g id="step-5-desc" data-pptx-bounds="820 280 180 140">
    <text x="828" y="304" font-size="17" fill="#2B4266">Nothing is sent<tspan x="828" dy="24">without a yes.</tspan><tspan x="828" dy="24">Every edit teaches</tspan><tspan x="828" dy="24">the system what</tspan><tspan x="828" dy="24">good looks like.</tspan></text>
  </g>
  <g id="step-6-desc" data-pptx-bounds="1009 280 180 140">
    <text x="1017" y="304" font-size="17" fill="#2B4266">Sent from the<tspan x="1017" dy="24">candidate's own</tspan><tspan x="1017" dy="24">account. Each reply</tspan><tspan x="1017" dy="24">gets a next draft,</tspan><tspan x="1017" dy="24">up to the ask.</tspan></text>
  </g>
  <g id="delivery-self" data-pptx-bounds="64 436 564 184">
    <rect x="64" y="436" width="564" height="184" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <text x="92" y="468" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="3" fill="#4A5F80">DEFAULT DELIVERY</text>
    <text x="92" y="506" font-family="Arial" font-size="24" font-weight="bold" fill="#0E1F3A">Self-send</text>
    <text x="92" y="544" font-size="19" fill="#2B4266">Knock researches and writes. The candidate copies each<tspan x="92" dy="26">approved message and sends it by hand from their own</tspan><tspan x="92" dy="26">LinkedIn, then pastes replies back for the next draft.</tspan></text>
  </g>
  <g id="delivery-assisted" data-pptx-bounds="652 436 564 184">
    <rect x="652" y="436" width="564" height="184" fill="#C4D9EF"/>
    <text x="680" y="468" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="3" fill="#2B4266">OPTIONAL DELIVERY</text>
    <text x="680" y="506" font-family="Arial" font-size="24" font-weight="bold" fill="#0E1F3A">Done-for-you</text>
    <text x="680" y="544" font-size="19" fill="#0E1F3A">The same research and writing. Approved text is sent from<tspan x="680" dy="26">the candidate's own account through a tool they connect</tspan><tspan x="680" dy="26">themselves, with written consent and a clear risk notice.</tspan></text>
  </g>
