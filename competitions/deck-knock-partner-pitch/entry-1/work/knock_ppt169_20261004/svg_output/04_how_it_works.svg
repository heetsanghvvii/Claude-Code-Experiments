  <g id="header" data-pptx-bounds="64 44 1152 136">
    <text x="64" y="74" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">03  WHAT KNOCK DOES</text>
    <text x="64" y="128" font-family="Georgia" font-size="40" fill="#1D2624">We do the outreach. The student stays in control.</text>
    <text x="64" y="166" font-size="20" fill="#5C6461">Four steps, run by people, supported by good tools.</text>
  </g>

  <g id="step-1" data-pptx-bounds="64 214 284 330">
