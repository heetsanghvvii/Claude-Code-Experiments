    <circle cx="766" cy="527" r="5" fill="#A9C7E6"/>
    <text x="788" y="534" font-size="22" fill="#EEF3F8">Personal first messages</text>
    <circle cx="766" cy="565" r="5" fill="#A9C7E6"/>
    <text x="788" y="572" font-size="22" fill="#EEF3F8">Reply drafts for every conversation</text>
