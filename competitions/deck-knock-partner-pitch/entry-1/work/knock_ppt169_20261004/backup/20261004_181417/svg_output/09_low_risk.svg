<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" data-pptx-page-role="content" font-family="Arial">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F6F2EA"/>

  <g id="header" data-pptx-bounds="64 44 1152 136">
    <text x="64" y="74" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">08  WHY IT IS SAFE TO SAY YES</text>
    <text x="64" y="128" font-family="Georgia" font-size="40" fill="#1D2624">Low effort for the club. Proof before endorsement.</text>
    <text x="64" y="166" font-size="20" fill="#5C6461">Your batch's inbox and your club's reputation stay protected.</text>
  </g>

  <g id="pull-quote" data-pptx-bounds="64 214 360 420">
    <rect x="64" y="224" width="4" height="380" fill="#A8743A"/>
    <text x="96" y="290" font-family="Georgia" font-size="34" font-style="italic" fill="#16302B">See the results
      <tspan x="96" dy="46">first. Then decide</tspan>
      <tspan x="96" dy="46">whether to</tspan>
      <tspan x="96" dy="46">recommend us.</tspan></text>
  </g>

  <g id="reasons" data-pptx-bounds="472 214 744 420">
    <g id="reason-1">
      <text x="472" y="250" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">INBOX</text>
      <text x="640" y="250" font-size="21" font-weight="bold" fill="#1D2624">One announcement. Nothing more.</text>
      <text x="640" y="280" font-size="18" fill="#5C6461">No mailing lists, no repeat posts to the batch.</text>
    </g>
    <line x1="472" y1="314" x2="1216" y2="314" stroke="#D9CFBF" stroke-width="1"/>
    <g id="reason-2">
      <text x="472" y="356" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">COST</text>
      <text x="640" y="356" font-size="21" font-weight="bold" fill="#1D2624">The pilot is free.</text>
      <text x="640" y="386" font-size="18" fill="#5C6461">No fee to the club and none to the 5 pilot students.</text>
    </g>
    <line x1="472" y1="420" x2="1216" y2="420" stroke="#D9CFBF" stroke-width="1"/>
    <g id="reason-3">
      <text x="472" y="462" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">CONTROL</text>
      <text x="640" y="462" font-size="21" font-weight="bold" fill="#1D2624">Students approve every message.</text>
      <text x="640" y="492" font-size="18" fill="#5C6461">Sent from their own account, at a human pace.</text>
    </g>
    <line x1="472" y1="526" x2="1216" y2="526" stroke="#D9CFBF" stroke-width="1"/>
    <g id="reason-4">
      <text x="472" y="568" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">EVIDENCE</text>
      <text x="640" y="568" font-size="21" font-weight="bold" fill="#1D2624">You choose who tests it.</text>
      <text x="640" y="598" font-size="18" fill="#5C6461">The club picks the pilot group and sees every result.</text>
    </g>
  </g>

  <g id="footer" data-pptx-role="footer" data-pptx-bounds="64 662 1152 40">
    <text x="64" y="690" font-family="Georgia" font-size="17" fill="#16302B">Knock</text>
    <text x="126" y="689" font-size="13" fill="#5C6461">Partner proposal for &lt;Club name&gt;</text>
    <rect x="1178" y="674" width="11" height="18" rx="2" fill="none" stroke="#A8743A" stroke-width="1.5"/>
    <text x="1216" y="690" font-family="Georgia" font-size="17" fill="#16302B" text-anchor="end">09</text>
  </g>
</svg>
