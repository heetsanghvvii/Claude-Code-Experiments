<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" data-pptx-page-role="content" font-family="Arial">
<defs>
  <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <polygon points="0,0 10,5 0,10" fill="#6B655B"/>
  </marker>
</defs>
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F0E6"/>
<g id="title" data-pptx-bounds="72 84 680 200">
  <text x="72" y="112" font-size="14" font-weight="bold" letter-spacing="3" fill="#B4692E">THE PROBLEM</text>
  <text x="72" y="172" font-family="Times New Roman" font-size="40" fill="#1F1D1A">Portals collect hundreds<tspan x="72" dy="50">of applications and send</tspan><tspan x="72" dy="50">back very few replies.</tspan></text>
</g>
<g id="portal-loop" data-pptx-bounds="72 330 664 120">
  <g id="loop-node-1">
    <rect x="72" y="338" width="184" height="108" rx="12" fill="#FBF8F2" stroke="#D8CEBB" stroke-width="1.5"/>
    <text x="92" y="368" font-size="17" font-weight="bold" fill="#B4692E">1</text>
    <text x="92" y="400" font-size="22" fill="#1F1D1A">Find a<tspan x="92" dy="28">listing</tspan></text>
  </g>
  <g id="loop-node-2">
    <rect x="302" y="338" width="184" height="108" rx="12" fill="#FBF8F2" stroke="#D8CEBB" stroke-width="1.5"/>
    <text x="322" y="368" font-size="17" font-weight="bold" fill="#B4692E">2</text>
    <text x="322" y="400" font-size="22" fill="#1F1D1A">Send the<tspan x="322" dy="28">same CV</tspan></text>
  </g>
  <g id="loop-node-3">
    <rect x="532" y="338" width="184" height="108" rx="12" fill="#FBF8F2" stroke="#D8CEBB" stroke-width="1.5"/>
    <text x="552" y="368" font-size="17" font-weight="bold" fill="#B4692E">3</text>
    <text x="552" y="400" font-size="22" fill="#1F1D1A">Wait, then<tspan x="552" dy="28">hear nothing</tspan></text>
  </g>
  <line x1="260" y1="392" x2="296" y2="392" stroke="#6B655B" stroke-width="2" marker-end="url(#arrowHead)"/>
  <line x1="490" y1="392" x2="526" y2="392" stroke="#6B655B" stroke-width="2" marker-end="url(#arrowHead)"/>
</g>
<g id="p02-repeat-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="leftArrow" data-pptx-frame="150 462 500 40" fill="#D8CEBB" stroke="none">
<path d="M 150 482 L 170 462 L 170 472 L 650 472 L 650 492 L 170 492 L 170 502 Z"/>
</g>
<g id="repeat-label" data-pptx-bounds="150 512 500 32">
  <text x="400" y="536" font-size="17" font-style="italic" text-anchor="middle" fill="#6B655B">Repeat with the next listing</text>
</g>
<g id="loop-caption" data-pptx-bounds="72 572 680 76">
  <text x="72" y="600" font-size="22" fill="#6B655B">Every application looks like the others,<tspan x="72" dy="34">and nobody on the other side is waiting for it.</tspan></text>
</g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="72 662 300 32">
  <text x="72" y="684" font-size="14" fill="#6B655B">Knock<tspan fill="#B4692E">   02</tspan></text>
</g>
<g id="people-hire-people" data-pptx-bounds="800 0 480 720">
  <rect x="800" y="0" width="480" height="720" fill="#1E3B33"/>
  <rect x="856" y="214" width="56" height="3" fill="#C9874B"/>
  <text x="856" y="300" font-family="Times New Roman" font-size="64" font-style="italic" fill="#F5F0E6">People hire<tspan x="856" dy="76">people.</tspan></text>
  <text x="856" y="456" font-size="22" fill="#B9C7BF">Hiring managers, team members<tspan x="856" dy="34">and alumni move candidates</tspan><tspan x="856" dy="34">forward. A job portal cannot</tspan><tspan x="856" dy="34">vouch for anyone.</tspan></text>
</g>
</svg>
