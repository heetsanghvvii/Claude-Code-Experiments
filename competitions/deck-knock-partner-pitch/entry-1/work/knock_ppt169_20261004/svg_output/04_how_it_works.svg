<path d="M 64 224 L 322 224 L 364 266 L 322 308 L 64 308 Z"/>
</g>
    <text x="92" y="276" font-family="Georgia" font-size="30" fill="#F6F2EA">01</text>
    <text x="64" y="364" font-family="Georgia" font-size="24" fill="#1D2624">Choose targets</text>
    <text x="64" y="402" font-size="18" fill="#5C6461">The student picks the
      <tspan x="64" dy="27">companies and roles they</tspan>
      <tspan x="64" dy="27">want. We agree the brief.</tspan></text>
  </g>

  <g id="step-2" data-pptx-bounds="372 214 270 330">
