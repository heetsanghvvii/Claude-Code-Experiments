<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" data-pptx-page-role="content" font-family="Arial">
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F0E6"/>
<g id="title" data-pptx-bounds="72 84 1136 160">
  <text x="72" y="112" font-size="14" font-weight="bold" letter-spacing="3" fill="#B4692E">WHAT ALREADY WORKS</text>
  <text x="72" y="172" font-family="Times New Roman" font-size="40" fill="#1F1D1A">Warm conversations open doors<tspan x="72" dy="50">that cold applications rarely do.</tspan></text>
</g>
<g id="cold-application" data-pptx-bounds="72 270 500 320">
  <rect x="72" y="276" width="500" height="308" rx="4" fill="none" stroke="#CFC4AF" stroke-width="1.5"/>
  <text x="104" y="330" font-family="Times New Roman" font-size="30" fill="#6B655B">Cold application</text>
  <g fill="#1F1D1A" font-size="22">
    <circle cx="110" cy="397" r="5" fill="#B5AC9B"/>
    <text x="128" y="404">Lands in a system, not with a person</text>
    <line x1="104" y1="432" x2="540" y2="432" stroke="#D8CEBB" stroke-width="1"/>
    <circle cx="110" cy="463" r="5" fill="#B5AC9B"/>
    <text x="128" y="470">Read as one of a pile</text>
    <line x1="104" y1="498" x2="540" y2="498" stroke="#D8CEBB" stroke-width="1"/>
    <circle cx="110" cy="529" r="5" fill="#B5AC9B"/>
    <text x="128" y="536">A filter decides the next step</text>
  </g>
</g>
<g id="warm-conversation" data-pptx-bounds="612 270 596 320">
  <rect x="612" y="276" width="596" height="308" rx="4" fill="#1E3B33"/>
  <text x="644" y="330" font-family="Times New Roman" font-size="30" fill="#F5F0E6">Warm conversation</text>
  <g fill="#F5F0E6" font-size="22">
    <circle cx="650" cy="397" r="5" fill="#C9874B"/>
    <text x="668" y="404">Starts with a person who can help</text>
    <line x1="644" y1="432" x2="1176" y2="432" stroke="#3E665A" stroke-width="1"/>
    <circle cx="650" cy="463" r="5" fill="#C9874B"/>
    <text x="668" y="470">Comes with context and a reason to talk</text>
    <line x1="644" y1="498" x2="1176" y2="498" stroke="#3E665A" stroke-width="1"/>
    <circle cx="650" cy="529" r="5" fill="#C9874B"/>
    <text x="668" y="536">Can become a referral or an interview</text>
  </g>
</g>
<g id="honesty-note" data-pptx-bounds="72 604 1136 40">
  <text x="72" y="630" font-size="17" font-style="italic" fill="#6B655B">Stated from experience, not a statistic. The pilot will produce our own numbers.</text>
</g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="72 662 300 32">
  <text x="72" y="684" font-size="14" fill="#6B655B">Knock<tspan fill="#B4692E">   03</tspan></text>
</g>
</svg>
