<path d="M 348 224 L 606 224 L 648 266 L 606 308 L 348 308 L 390 266 Z"/>
</g>
    <text x="410" y="276" font-family="Georgia" font-size="30" fill="#F6F2EA">02</text>
    <text x="378" y="364" font-family="Georgia" font-size="24" fill="#1D2624">Find the right people</text>
    <text x="378" y="402" font-size="18" fill="#5C6461">Hiring managers, team
      <tspan x="378" dy="27">members, alumni and senior</tspan>
      <tspan x="378" dy="27">people who can introduce.</tspan></text>
  </g>

  <g id="step-3" data-pptx-bounds="656 214 270 330">
