  <g id="insight" data-pptx-bounds="796 214 420 420">
    <text x="796" y="262" font-size="20" fill="#1D2624">Each application joins a queue
      <tspan x="796" dy="31">with hundreds of others.</tspan>
      <tspan x="796" dy="31">Filters read it before a person does.</tspan>
      <tspan x="796" dy="31">Strong candidates go unheard.</tspan></text>
