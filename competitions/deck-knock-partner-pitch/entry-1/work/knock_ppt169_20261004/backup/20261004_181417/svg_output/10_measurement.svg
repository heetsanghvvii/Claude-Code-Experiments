<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" data-pptx-page-role="content" font-family="Arial">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F6F2EA"/>

  <g id="header" data-pptx-bounds="64 44 1152 136">
    <text x="64" y="74" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">09  HOW WE MEASURE SUCCESS</text>
    <text x="64" y="128" font-family="Georgia" font-size="40" fill="#1D2624">Success is counted in interviews, not messages.</text>
    <text x="64" y="166" font-size="20" fill="#5C6461">No promised numbers before the pilot. We report what actually happens.</text>
  </g>

  <g id="metric" data-pptx-bounds="64 200 620 446">
    <rect x="64" y="204" width="620" height="438" rx="6" fill="#16302B"/>
    <text x="104" y="256" font-size="15" font-weight="bold" letter-spacing="2" fill="#C9A063">THE ONE NUMBER</text>
    <text x="104" y="344" font-family="Georgia" font-size="46" fill="#F6F2EA">Interviews per
      <tspan x="104" dy="60" fill="#E9C98C">100 people contacted</tspan></text>
    <line x1="104" y1="452" x2="644" y2="452" stroke="#2F5A50" stroke-width="1"/>
    <text x="104" y="500" font-size="19" fill="#C8CFC9">Interviews secured, divided by people contacted,
      <tspan x="104" dy="28">times 100. Simple to check, hard to inflate.</tspan></text>
    <text x="104" y="600" font-size="16" fill="#C9A063">Replies and referrals are tracked along the way.</text>
  </g>

  <g id="per-student" data-pptx-bounds="724 200 492 210">
    <rect x="724" y="204" width="492" height="202" rx="6" fill="#FFFFFF" stroke="#D9CFBF" stroke-width="1"/>
    <text x="760" y="252" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">PER STUDENT</text>
    <text x="760" y="292" font-family="Georgia" font-size="24" fill="#1D2624">Each student sees their own</text>
    <text x="760" y="336" font-size="18" fill="#5C6461">People contacted, replies, referrals and
      <tspan x="760" dy="27">interviews, in one private summary.</tspan></text>
  </g>

  <g id="aggregate" data-pptx-bounds="724 432 492 214">
    <rect x="724" y="440" width="492" height="202" rx="6" fill="#FFFFFF" stroke="#D9CFBF" stroke-width="1"/>
    <text x="760" y="488" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">IN AGGREGATE</text>
    <text x="760" y="528" font-family="Georgia" font-size="24" fill="#1D2624">The club sees the whole pilot</text>
    <text x="760" y="572" font-size="18" fill="#5C6461">One combined number for the group,
      <tspan x="760" dy="27">ready to share with the batch.</tspan></text>
  </g>

