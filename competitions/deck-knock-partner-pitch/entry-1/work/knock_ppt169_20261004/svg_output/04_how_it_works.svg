    <text x="694" y="276" font-family="Georgia" font-size="30" fill="#F6F2EA">03</text>
    <text x="662" y="364" font-family="Georgia" font-size="24" fill="#1D2624">Write the first note</text>
    <text x="662" y="402" font-size="18" fill="#5C6461">One personal message per
      <tspan x="662" dy="27">person, built on something</tspan>
      <tspan x="662" dy="27">genuinely shared.</tspan></text>
  </g>

