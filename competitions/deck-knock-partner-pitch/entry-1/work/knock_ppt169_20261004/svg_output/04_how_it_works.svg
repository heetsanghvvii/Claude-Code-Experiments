    <text x="978" y="276" font-family="Georgia" font-size="30" fill="#F6F2EA">04</text>
    <text x="946" y="364" font-family="Georgia" font-size="24" fill="#1D2624">Guide every reply</text>
    <text x="946" y="402" font-size="18" fill="#5C6461">From the first answer to a
      <tspan x="946" dy="27">referral or an interview,</tspan>
      <tspan x="946" dy="27">one reply at a time.</tspan></text>
