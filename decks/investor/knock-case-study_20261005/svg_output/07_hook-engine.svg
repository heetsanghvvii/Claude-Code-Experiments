<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman" lang="en" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#EEF3F8"/>
  <g id="header" data-pptx-bounds="64 36 1152 94">
    <rect x="64" y="38" width="40" height="4" fill="#B3301B"/>
    <text x="64" y="66" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="3" fill="#4A5F80">06  THE RESEARCH AND HOOK ENGINE</text>
    <text x="64" y="112" font-family="Arial" font-size="36" font-weight="bold" fill="#0E1F3A">Every hook is a cited fact, or the message is not written</text>
  </g>
  <g id="stage-discover" data-pptx-bounds="64 168 500 126">
    <line x1="84" y1="194" x2="84" y2="320" stroke="#4A5F80" stroke-width="3" stroke-dasharray="1,8" stroke-linecap="round"/>
    <circle cx="84" cy="194" r="10" fill="#0E1F3A"/>
    <text x="112" y="200" font-family="Arial" font-size="20" font-weight="bold" fill="#0E1F3A">Discover</text>
    <text x="112" y="230" font-size="18" fill="#2B4266">Public search results only. No LinkedIn login,<tspan x="112" dy="24">no scraping. Full profiles come from LinkedIn's</tspan><tspan x="112" dy="24">own Save to PDF, done by hand.</tspan></text>
  </g>
  <g id="stage-enrich" data-pptx-bounds="64 300 500 100">
    <line x1="84" y1="326" x2="84" y2="418" stroke="#4A5F80" stroke-width="3" stroke-dasharray="1,8" stroke-linecap="round"/>
    <circle cx="84" cy="326" r="10" fill="#0E1F3A"/>
    <text x="112" y="332" font-family="Arial" font-size="20" font-weight="bold" fill="#0E1F3A">Enrich</text>
    <text x="112" y="362" font-size="18" fill="#2B4266">Public posts, talks and articles become facts,<tspan x="112" dy="24">and each fact keeps its source.</tspan></text>
  </g>
  <g id="stage-hook" data-pptx-bounds="64 406 500 100">
    <line x1="84" y1="432" x2="84" y2="516" stroke="#4A5F80" stroke-width="3" stroke-dasharray="1,8" stroke-linecap="round"/>
    <circle cx="84" cy="432" r="10" fill="#B3301B"/>
    <text x="112" y="438" font-family="Arial" font-size="20" font-weight="bold" fill="#B3301B">Find the hook</text>
    <text x="112" y="468" font-size="18" fill="#2B4266">A hook must cite a real fact from both profiles.<tspan x="112" dy="24">No citation, no hook.</tspan></text>
  </g>
  <g id="stage-rules" data-pptx-bounds="64 506 500 100">
    <circle cx="84" cy="532" r="10" fill="#0E1F3A"/>
    <text x="112" y="538" font-family="Arial" font-size="20" font-weight="bold" fill="#0E1F3A">Check the rules</text>
    <text x="112" y="568" font-size="18" fill="#2B4266">Short, no honorifics, one question, no stock AI<tspan x="112" dy="24">phrases. Fetched text is data, never instructions.</tspan></text>
  </g>
  <g id="hook-diagram" data-pptx-bounds="640 176 576 420">
    <text x="660" y="196" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="3" fill="#B3301B">ILLUSTRATIVE EXAMPLE, NOT A REAL CLIENT</text>
    <circle cx="800" cy="390" r="150" fill="#A9C7E6" fill-opacity="0.8"/>
    <circle cx="980" cy="390" r="150" fill="#0E1F3A" fill-opacity="0.22"/>
    <circle cx="800" cy="390" r="150" fill="none" stroke="#0E1F3A" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="980" cy="390" r="150" fill="none" stroke="#0E1F3A" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="738" y="352" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#0E1F3A">CANDIDATE</text>
    <text x="738" y="384" font-size="17" text-anchor="middle" fill="#0E1F3A">Moving from brand<tspan x="738" dy="22">management toward</tspan><tspan x="738" dy="22">product</tspan></text>
    <text x="1042" y="352" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle" fill="#0E1F3A">PROSPECT</text>
    <text x="1042" y="384" font-size="17" text-anchor="middle" fill="#0E1F3A">Moved from a large<tspan x="1042" dy="22">marketplace into a</tspan><tspan x="1042" dy="22">product role</tspan></text>
    <text x="890" y="372" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0E1F3A">A similar<tspan x="890" dy="20">jump</tspan></text>
    <text x="800" y="570" font-family="Arial" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle" fill="#2B4266">SOURCE: THEIR PROFILE</text>
    <text x="980" y="570" font-family="Arial" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle" fill="#2B4266">SOURCE: A PUBLIC POST</text>
  </g>
  <g id="hook-caption" data-pptx-bounds="640 604 576 56">
    <text x="660" y="628" font-size="19" font-style="italic" fill="#0E1F3A">Opener: "Saw you moved into product. I'm making a<tspan x="660" dy="26">similar jump, so I'm curious what changed most."</tspan></text>
  </g>
  <g id="footer" data-pptx-bounds="64 664 1152 44">
    <line x1="64" y1="676" x2="1216" y2="676" stroke="#4A5F80" stroke-width="3" stroke-dasharray="1,8" stroke-linecap="round" stroke-opacity="0.6"/>
    <text x="64" y="700" font-family="Arial" font-size="12" font-weight="bold" letter-spacing="2" fill="#4A5F80">KNOCK  |  CASE STUDY</text>
    <text x="1216" y="700" font-family="Arial" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="end" fill="#4A5F80">07 / 13</text>
  </g>
</svg>
