<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" data-pptx-page-role="content" font-family="Arial">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F6F2EA"/>

  <g id="header" data-pptx-bounds="64 44 1152 136">
    <text x="64" y="74" font-size="15" font-weight="bold" letter-spacing="2" fill="#8A5A24">04  AN EXAMPLE FIRST MESSAGE</text>
    <text x="64" y="128" font-family="Georgia" font-size="40" fill="#1D2624">Every first message starts from something real.</text>
    <text x="64" y="166" font-size="20" fill="#5C6461">Short, specific and easy to answer. Written for one person only.</text>
  </g>

  <g id="message" data-pptx-bounds="64 196 712 400">
    <g id="p05-bubble-shape" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="wedgeRoundRectCallout" data-pptx-frame="64 204 700 300" data-pptx-av-adj1="val -38000" data-pptx-av-adj2="val 64000" data-pptx-av-adj3="val 8000" fill="#FFFFFF" stroke="#D9CFBF" stroke-width="1.5">
<path d="M 64 228 A 24 24 0 0 1 88 204 L 180.67 204 L 180.67 204 L 355.67 204 L 740 204 A 24 24 0 0 1 764 228 L 764 379 L 764 379 L 764 454 L 764 480 A 24 24 0 0 1 740 504 L 355.67 504 L 148 546 L 180.67 504 L 88 504 A 24 24 0 0 1 64 480 L 64 454 L 64 379 L 64 379 Z"/>
</g>
    <text x="100" y="246" font-size="14" font-weight="bold" letter-spacing="2" fill="#5C6461">TO RAHUL  ·  PRODUCT, ZEPTO</text>
    <line x1="100" y1="262" x2="728" y2="262" stroke="#E6DED0" stroke-width="1"/>
    <text x="100" y="306" font-family="Georgia" font-size="26" fill="#1D2624">Hey Rahul, saw you <tspan fill="#8A5A24" font-weight="bold">moved from Flipkart</tspan>
      <tspan x="100" dy="40"><tspan fill="#8A5A24" font-weight="bold">into product at Zepto.</tspan> I'm making a</tspan>
      <tspan x="100" dy="40"><tspan fill="#8A5A24" font-weight="bold">similar jump from brand management.</tspan></tspan>
      <tspan x="100" dy="40">Curious, <tspan fill="#8A5A24" font-weight="bold">what was the biggest adjustment</tspan></tspan>
      <tspan x="100" dy="40"><tspan fill="#8A5A24" font-weight="bold">for you?</tspan></tspan></text>
    <text x="196" y="582" font-size="15" fill="#5C6461">Drafted by Knock. Approved and sent by the student.</text>
  </g>

  <g id="why-it-works" data-pptx-bounds="820 196 396 452">
    <text x="820" y="226" font-size="15" font-weight="bold" letter-spacing="2" fill="#16302B">WHY IT WORKS</text>
    <g id="note-1">
      <circle cx="838" cy="272" r="18" fill="#16302B"/>
      <text x="838" y="279" font-family="Georgia" font-size="19" fill="#F6F2EA" text-anchor="middle">1</text>
      <text x="872" y="270" font-size="19" font-weight="bold" fill="#1D2624">A specific, true detail</text>
      <text x="872" y="300" font-size="17" fill="#5C6461">It shows we read his path,
        <tspan x="872" dy="25">not a list of names.</tspan></text>
    </g>
    <line x1="820" y1="354" x2="1216" y2="354" stroke="#D9CFBF" stroke-width="1"/>
    <g id="note-2">
      <circle cx="838" cy="402" r="18" fill="#16302B"/>
      <text x="838" y="409" font-family="Georgia" font-size="19" fill="#F6F2EA" text-anchor="middle">2</text>
      <text x="872" y="400" font-size="19" font-weight="bold" fill="#1D2624">A shared reason to talk</text>
      <text x="872" y="430" font-size="17" fill="#5C6461">The same kind of move,
        <tspan x="872" dy="25">one step behind him.</tspan></text>
    </g>
    <line x1="820" y1="484" x2="1216" y2="484" stroke="#D9CFBF" stroke-width="1"/>
    <g id="note-3">
      <circle cx="838" cy="532" r="18" fill="#16302B"/>
      <text x="838" y="539" font-family="Georgia" font-size="19" fill="#F6F2EA" text-anchor="middle">3</text>
      <text x="872" y="530" font-size="19" font-weight="bold" fill="#1D2624">An easy question, no ask</text>
      <text x="872" y="560" font-size="17" fill="#5C6461">No request for a job or a
        <tspan x="872" dy="25">referral. That comes later.</tspan></text>
    </g>
  </g>

