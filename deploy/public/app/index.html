<!doctype html>
<html lang="en-IN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your account | Knock</title>
<meta name="description" content="Your Knock account: the people worth talking to, the messages written for them, and where each conversation stands.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#EEF3F8">
<link rel="icon" type="image/svg+xml" href="/brand/knock-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet">
<style>
/* Knock brand tokens (brand/tokens.css), inlined. Light only, like the landing page, /start, /portal and the CRM. */
:root{
  --inland:#A9C7E6; --inland-2:#97B9DD; --inland-3:#C4D9EF;
  --paper:#EEF3F8; --white:#FAFCFE;
  --ink:#0E1F3A; --ink-2:#2B4266; --ink-3:#4A5F80;
  --post:#B3301B; --post-soft:#F3D9D2;
  --rule:rgba(14,31,58,.2); --rule-strong:rgba(14,31,58,.55);
  --display:"Archivo","Arial Narrow",sans-serif;
  --text:"Archivo",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --shadow-sheet:0 30px 60px -36px rgba(14,31,58,.55);
  --shadow-note:0 30px 50px -30px rgba(14,31,58,.55),0 4px 10px -6px rgba(14,31,58,.3);
  --side:256px; --tabs:64px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:24px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:1rem;line-height:1.55;font-variation-settings:"wdth" 100;font-stretch:100%;caret-color:var(--post);overflow-x:hidden;min-height:100vh;min-height:100dvh}
::selection{background:var(--ink);color:var(--inland-3)}
svg{display:block;max-width:100%}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--post);outline-offset:3px;border-radius:2px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3{font-family:var(--display);font-variation-settings:"wdth" 72;font-stretch:72%;font-weight:800;line-height:.98;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
button,input,select,textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--white);padding:10px 16px;z-index:80;text-decoration:none;font-weight:600;border-radius:4px}
.skip:focus{top:12px}
.num{font-variant-numeric:tabular-nums lining-nums}
html{scrollbar-color:rgba(14,31,58,.35) transparent}

/* ---------- shell ---------- */
.shell{min-height:100vh;min-height:100dvh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--white);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:22px 14px 16px;z-index:30}
.side .mark{display:block;padding:4px 10px 22px;line-height:0}
.side .mark img{width:118px;height:auto}
.nav{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 12px;border-radius:4px;text-decoration:none;font-weight:500;color:var(--ink-2);transition:background-color .15s,color .15s}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--paper);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--white);font-weight:600}
.nav .badge{margin-left:auto;min-width:24px;height:22px;padding:0 7px;border-radius:99px;background:var(--inland-3);color:var(--ink);font-size:.8rem;font-weight:700;display:grid;place-items:center}
.nav a[aria-current="page"] .badge{background:var(--inland);color:var(--ink)}
.nav .sep{height:1px;background:var(--rule);margin:10px 12px}
.acct{margin-top:auto;border-top:1px solid var(--rule);padding:14px 10px 0;display:grid;gap:2px;min-width:0}
.acct b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct span{font-size:.85rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .linkish{justify-self:start;margin-top:6px}

.mtop{display:none}
.tabs{display:none}
.main{margin-left:var(--side);min-width:0}
.view{max-width:1120px;margin:0 auto;padding:36px clamp(20px,3.4vw,48px) 72px;min-width:0}
.view.enter{animation:enter .22s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

@media (max-width:999px){
  .side{display:none}
  .main{margin-left:0;padding-bottom:calc(var(--tabs) + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--rule)}
  .mtop .mark{line-height:0}.mtop .mark img{width:96px;height:auto}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--white);display:grid;place-items:center;font-weight:700;text-decoration:none;font-size:.95rem}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs a{position:relative;display:grid;justify-items:center;align-content:center;gap:3px;min-height:var(--tabs);text-decoration:none;font-size:.72rem;font-weight:600;color:var(--ink-3);letter-spacing:.01em}
  .tabs a svg{width:22px;height:22px}
  .tabs a[aria-current="page"]{color:var(--ink)}
  .tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
  .tabs .dot{position:absolute;top:9px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ink);color:var(--white);font-size:.68rem;display:grid;place-items:center}
  .view{padding:22px 16px 40px}
}

/* ---------- type and common pieces ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:24px}
.ph h1{font-size:2.6rem;outline:none}
.ph .sub{margin-top:8px;font-family:var(--serif);font-size:1.1rem;color:var(--ink-2);max-width:60ch}
.k{font-weight:600;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h2.h{font-size:1.75rem}
.sec{margin-top:40px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:16px}
.sec-h p{color:var(--ink-2);font-size:.95rem}
.card{position:relative;background:var(--white);border-radius:4px;padding:24px;box-shadow:var(--shadow-note);min-width:0}
.panel{background:var(--white);border:1px solid var(--rule);border-radius:4px;padding:20px 22px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--inland-3);color:var(--ink);font-weight:600;font-size:.8rem;white-space:nowrap;line-height:1.4}
.chip.ink{background:var(--ink);color:var(--white)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule-strong)}
.chip.quiet{background:transparent;box-shadow:inset 0 0 0 1px var(--rule-strong);color:var(--ink-2)}
.card>.why:first-child{margin-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:44px;padding:.5em 1.15em;background:var(--ink);color:var(--white);border:2px solid var(--ink);border-radius:999px;font-family:var(--display);font-variation-settings:"wdth" 88;font-stretch:88%;font-weight:700;font-size:1rem;letter-spacing:.01em;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease),transform 160ms var(--ease)}
.btn:hover{background:var(--post);border-color:var(--post);box-shadow:0 8px 20px -10px rgba(179,48,27,.7)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.6;cursor:progress;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--white);border-color:var(--ink);box-shadow:none}
.btn.small{min-height:38px;font-size:.92rem;padding:.35em .95em}
.btn svg{width:18px;height:18px;flex:none}
.linkish{background:none;border:0;padding:6px 0;font-size:.92rem;color:var(--ink-2);text-decoration:underline;text-underline-offset:.22em;cursor:pointer}
.linkish:hover{color:var(--ink);text-decoration-thickness:2px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.95rem;text-decoration:none;color:var(--ink-2);margin-bottom:14px}
.back:hover{color:var(--ink);text-decoration:underline}
.back svg{width:18px;height:18px}
.empty{padding:22px 24px;border:1.5px dashed var(--rule-strong);border-radius:4px;font-family:var(--serif);font-style:italic;font-size:1.08rem;color:var(--ink-2);max-width:68ch;background:color-mix(in srgb,var(--white) 50%,transparent)}
.empty a{color:var(--ink);font-style:normal;font-family:var(--text);font-weight:600;font-size:1rem}
label.l{display:block;font-weight:600;font-size:.95rem}
.help{font-size:.88rem;color:var(--ink-2);margin-top:2px}
input[type=text],input[type=search],input[type=email],textarea,select{width:100%;min-height:46px;padding:10px 14px;border:1.5px solid rgba(14,31,58,.45);border-radius:4px;background:var(--white);color:var(--ink);transition:border-color .2s,box-shadow .2s,background-color .2s}
textarea{min-height:110px;font-family:var(--serif);font-size:1.05rem;line-height:1.5;resize:vertical;display:block}
input:focus,textarea:not([readonly]):focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(179,48,27,.35)}
::placeholder{color:#5F7290;opacity:1}
select{padding-right:40px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;cursor:pointer}

/* ---------- home ---------- */
.sheet{position:relative;background:var(--inland);border-radius:4px;padding:36px 48px 32px;box-shadow:var(--shadow-sheet);overflow:hidden;isolation:isolate}
.sheet::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),radial-gradient(120% 70% at 85% 0%,rgba(255,255,255,.25),transparent 60%)}
.perf{position:absolute;top:0;bottom:0;width:10px;background:radial-gradient(circle,var(--paper) 2.6px,transparent 3.2px) center top/10px 14px repeat-y}
.perf.l{left:12px}.perf.r{right:12px}
.sheet .stamp{position:absolute;right:52px;top:32px;width:76px;transform:rotate(3deg);filter:drop-shadow(0 6px 8px rgba(14,31,58,.22))}
.sheet h1{font-size:3.2rem;max-width:16ch;padding-right:90px;outline:none}
.sheet .lede{margin-top:10px;font-family:var(--serif);font-size:1.18rem;max-width:58ch;color:var(--ink)}
.tasks{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tasks a{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 14px;padding:14px 16px;background:var(--white);border-radius:4px;text-decoration:none;min-height:76px;transition:box-shadow .2s var(--ease),transform .2s var(--ease)}
.tasks a:hover{box-shadow:0 14px 26px -18px rgba(14,31,58,.6);transform:translateY(-1px)}
.tasks .n{font:800 2.2rem/1 var(--display);font-variation-settings:"wdth" 72;font-stretch:72%;font-variant-numeric:tabular-nums lining-nums;min-width:1.2ch}
.tasks .t{font-weight:600;line-height:1.3}
.tasks .t small{display:block;font-weight:400;font-size:.86rem;color:var(--ink-2)}
.tasks svg{width:18px;height:18px;color:var(--ink-2)}
.tasks .done .n{color:var(--ink-3)}
.strip{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative}
.strip::before{content:"";position:absolute;left:calc(100%/12);right:calc(100%/12);top:11px;border-top:2px dashed rgba(14,31,58,.45)}
.strip li{position:relative;display:grid;justify-items:center;text-align:center;gap:4px;min-width:0}
.strip .dot{width:24px;height:24px;border-radius:50%;background:var(--inland-3);border:2px solid var(--ink);position:relative;z-index:1}
.strip .on .dot{background:var(--ink)}
.strip .n{font:800 1.8rem/1 var(--display);font-variation-settings:"wdth" 72;font-stretch:72%;font-variant-numeric:tabular-nums lining-nums}
.strip .l{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;overflow-wrap:anywhere;line-height:1.25}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;margin-top:28px;align-items:start}
.doing{list-style:none;margin:0;padding:0;display:grid}
.doing li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule)}
.doing li:last-child{border-bottom:0}
.doing .ic{width:28px;height:28px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--ink-2)}
.doing .ic svg{width:16px;height:16px}
.doing p{font-weight:500;padding-top:3px}
.feed{list-style:none;margin:0;padding:0;display:grid}
.feed li{display:grid;grid-template-columns:156px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.feed li:last-child{border-bottom:0}
.feed time{font-size:.86rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.feed a{text-decoration:none;font-weight:600}
.feed a:hover{text-decoration:underline}
.feed .co{color:var(--ink-2)}
.planmini .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.planmini .big{font:800 2rem/1 var(--display);font-variation-settings:"wdth" 72;font-stretch:72%}
.bar{height:8px;border-radius:99px;background:var(--paper);overflow:hidden;margin-top:10px;box-shadow:inset 0 0 0 1px var(--rule)}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transform-origin:left;animation:grow .6s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.meta-line{font-size:.9rem;color:var(--ink-2);margin-top:8px}

/* ---------- send today ---------- */
.pace{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.slots{display:flex;gap:4px}
.slots i{width:12px;height:16px;border-radius:2px;background:var(--white);box-shadow:inset 0 0 0 1.5px rgba(14,31,58,.4)}
.slots i.on{background:var(--ink);box-shadow:none}
.pace span{font-size:.92rem;color:var(--ink-2)}
.list{display:grid;gap:20px}
.who{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;justify-content:space-between}
.who h3{font-size:1.8rem}
.who h3 a{text-decoration:none}
.who h3 a:hover{text-decoration:underline}
.who .role{margin-top:4px;color:var(--ink-2)}
.why{margin-top:16px;display:grid;gap:8px}
.hook{font-family:var(--serif);font-size:1.12rem;line-height:1.42}
.facts{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:8px}
.facts li{display:grid;grid-template-columns:56px 1fr;gap:10px;font-size:.95rem;align-items:baseline}
.facts .whose{font-weight:700;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);border-top:2px solid var(--inland-2);padding-top:3px}
.facts .src{display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-size:.84rem;color:var(--ink-3)}
.facts a.src{color:var(--ink-2)}
.facts a.src svg{width:12px;height:12px}
.draft{margin-top:18px}
.draft-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.count{font-size:.84rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.count.over{color:var(--post);font-weight:600}
textarea.msgbox{margin-top:8px;min-height:0;background:var(--paper);border-color:transparent;resize:none;overflow:hidden}
textarea.msgbox[readonly]{cursor:text;box-shadow:inset 0 0 0 1px var(--rule)}
textarea.msgbox:not([readonly]){border-color:rgba(14,31,58,.45);background:var(--white);resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.actions .sent{margin-left:auto}
.foot{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;justify-content:space-between}
.foot p{font-size:.88rem;color:var(--ink-3)}
.leaving{overflow:hidden;transition:height .26s var(--ease),opacity .2s var(--ease),margin .26s var(--ease),padding .26s var(--ease)!important}
.done-day{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:36px}
.done-day img{width:96px;transform:rotate(-6deg);filter:drop-shadow(0 6px 8px rgba(14,31,58,.22));animation:stampIn .6s var(--ease) both}
@keyframes stampIn{0%{opacity:0;transform:rotate(-20deg) scale(1.3)}100%{opacity:1;transform:rotate(-6deg) scale(1)}}
.done-day h2{font-size:2.2rem}
.done-day p{margin-top:8px;font-family:var(--serif);font-size:1.1rem;color:var(--ink-2);max-width:52ch}
.later{margin-top:18px;font-size:.95rem;color:var(--ink-2)}

/* ---------- people ---------- */
.filters{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{padding-left:40px}
.shown{font-size:.9rem;color:var(--ink-2);margin:0 0 10px}
.tbl{width:100%;border-collapse:collapse;background:var(--white);border-radius:4px;box-shadow:var(--shadow-note);overflow:hidden}
.tbl th{text-align:left;font-weight:600;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:12px 16px;border-bottom:2px solid var(--ink);background:var(--white)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background-color .12s}
.tbl tbody tr:hover{background:var(--paper)}
.tbl a.nm{font-weight:700;text-decoration:none}
.tbl a.nm:hover{text-decoration:underline}
.tbl .hl{display:block;font-size:.88rem;color:var(--ink-2);max-width:38ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl time{font-size:.88rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.plist{display:none;list-style:none;margin:0;padding:0;background:var(--white);border-radius:4px;box-shadow:var(--shadow-note)}
.plist li{border-bottom:1px solid var(--rule)}
.plist li:last-child{border-bottom:0}
.plist a{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;text-decoration:none}
.plist b{font-weight:700}
.plist .hl{grid-column:1/-1;font-size:.88rem;color:var(--ink-2)}
@media (max-width:760px){.tbl{display:none}.plist{display:block}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}

/* ---------- person ---------- */
.p-head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.p-head h1{font-size:2.8rem;outline:none}
.p-head .role{margin-top:6px;color:var(--ink-2);font-size:1.05rem}
.p-head .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.p-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.p-grid aside{position:sticky;top:24px;display:grid;gap:16px}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:400 1.02rem/1.45 var(--serif)}
.msg.out{align-self:flex-end;background:var(--ink);color:var(--white);border-bottom-right-radius:2px}
.msg.in{align-self:flex-start;background:var(--inland-3);color:var(--ink);border-bottom-left-radius:2px}
.msg.pending{background:var(--paper);border:1.5px dashed var(--rule-strong)}
.msg .meta{display:block;font:600 .74rem var(--text);letter-spacing:.03em;opacity:.85;margin-top:4px}

.combo .none{padding:10px 12px;color:var(--ink-2);font-size:.92rem}

.tl{list-style:none;margin:0;padding:0;position:relative}

.tag{display:inline-flex;align-items:center;gap:2px;padding:2px 2px 2px 10px;border-radius:99px;background:var(--inland-3);font-weight:600;font-size:.9rem;max-width:100%}
.tag.top{background:var(--ink);color:var(--white)}

.sk-line{height:14px;margin-top:10px}
.sk-card{height:220px;margin-top:20px}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:grid;gap:8px;justify-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--white);padding:12px 20px;border-radius:99px;font-weight:600;box-shadow:var(--shadow-sheet);text-align:center;animation:toastIn .22s var(--ease) both}
.toast.out{animation:toastOut .18s ease-in both}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(4px)}}
@media (max-width:999px){.toasts{bottom:calc(var(--tabs) + 14px + env(safe-area-inset-bottom,0px))}}
dialog{border:0;border-radius:6px;padding:28px;max-width:min(440px,calc(100vw - 32px));background:var(--white);color:var(--ink);box-shadow:var(--shadow-sheet)}

dialog .actions{justify-content:flex-end;margin-top:22px}
.state{max-width:560px;margin:clamp(24px,8vh,96px) auto 0;padding:0 16px}

.state-top{display:flex;justify-content:center;padding:28px 16px 0}
.state-top img{width:120px}

@media (max-width:1100px){.tasks{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}

@media (max-width:760px){

  .actions .sent{flex-basis:100%;margin-left:0}
  .facts li{grid-template-columns:1fr;gap:2px}
  .facts .whose{border-top:0;padding-top:0}
  .facts .src{margin-left:0;display:flex}
  .feed li{grid-template-columns:1fr;gap:2px}
  .p-head h1{font-size:2.2rem}
  .plan-facts{grid-template-columns:1fr 1fr}
  .done-day{grid-template-columns:1fr;gap:16px;padding:24px}

  .msg{max-width:94%}
  .safe{padding:24px 20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

      '<section aria-labelledby="plan-h"><div class="sec-h"><h2 class="h" id="plan-h">Your plan</h2><a href="#/plan" class="linkish">Details</a></div><div class="panel planmini">' +

  function filtered(){

  function vPerson(r){

    return new Promise(ok => {
      const d = $("#dlg");
      if (typeof d.showModal !== "function") return ok(confirm("Skip " + p.name + "? We will not suggest a message to them again."));
      $("#dlg-h").textContent = "Skip " + p.name + "?"; $("#dlg-p").textContent = "We will not suggest a message to " + first(p.name) + " again. You can still find them under My people.";
      const yes = $("#dlg-yes"), no = $("#dlg-no");
      const fin = v => { yes.onclick = no.onclick = null; d.onclose = null; if (d.open) d.close(); ok(v); };
      yes.onclick = () => fin(true); no.onclick = () => fin(false); d.onclose = () => fin(false);
      d.showModal(); no.focus();
    });
  }

  // ---------- events ----------
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.matches("textarea[data-draft]")) {
      EDITING[t.dataset.draft] = t.value; size(t);
      const p = person(t.dataset.draft), c = $("#c-" + CSS.escape(t.dataset.draft));
      if (p && c) c.outerHTML = counter(p, t.value);
    }
    if (t.id === "f-q") { FILTER.q = t.value; $("#rows").innerHTML = peopleRows(); }
    if (t.matches("[data-path]") && PDRAFT) {
      const [a, b] = t.dataset.path.split(".");
      if (b) PDRAFT[a][b] = t.value; else PDRAFT[a] = t.value;
      savebar();
    }
    if (t.id === "cb-in") comboOpen(t.value);
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (["f-company","f-type","f-status"].includes(t.id)) {
      FILTER[t.id.slice(2)] = t.value;
      if (t.id === "f-status" && parseRoute().q.get("status")) history.replaceState(null, "", "#/people");
      $("#rows").innerHTML = peopleRows();
    }
    if (t.name === "tone" && PDRAFT) { PDRAFT.tone = t.value; savebar(); }
    if (t.matches("input[type=file][data-kind]") && t.files && t.files[0]) upload(t);
  });

  function addTag(input, refocus){
    const key = input.dataset.tagin, list = PDRAFT[TAGS[key]], v = input.value.replace(/\s+/g, " ").trim().slice(0, 120);
    if (!v) return false;
    if (list.some(x => x.toLowerCase() === v.toLowerCase())) { toast(v + " is already on your list."); input.value = ""; return true; }
    list.push(v); input.value = "";
    render(false); const again = $("#t-" + key); if (again && refocus !== false) again.focus();
    return true;
  }
  document.addEventListener("keydown", e => {
    const t = e.target;
    if (t.matches && t.matches("[data-tagin]")) {
      if (e.key === "Enter" || e.key === ",") { e.preventDefault(); addTag(t); }
      else if (e.key === "Backspace" && !t.value) { const list = PDRAFT[TAGS[t.dataset.tagin]]; if (list.length) { list.pop(); render(false); const a = $("#t-" + t.dataset.tagin); if (a) a.focus(); } }
    }
    if (t.id === "cb-in") comboKey(e);
  });
  document.addEventListener("focusout", e => { if (e.target.matches && e.target.matches("[data-tagin]") && e.target.value.trim()) addTag(e.target, false); });

  // combobox for the reply picker
  let cbIndex = -1, cbItems = [];
  function comboOpen(q){
    const list = $("#cb-list"), input = $("#cb-in"); if (!list) return;
    q = (q || "").trim().toLowerCase();
    cbItems = S.people.filter(p => p.first_sent_at && p.section !== "skipped" && (!q || (p.name + " " + p.company).toLowerCase().includes(q))).slice(0, 30);
    cbIndex = cbItems.length ? 0 : -1;
    list.innerHTML = cbItems.length ? cbItems.map((p, i) => '<li role="option" id="cb-' + i + '" data-pick="' + esc(p.id) + '" aria-selected="' + (i === cbIndex) + '">' + esc(p.name) + '<small>' + esc(p.company) + '</small></li>').join("") : '<li class="none" role="presentation">No one you have messaged matches.</li>';
    list.hidden = false; input.setAttribute("aria-expanded", "true");
    input.setAttribute("aria-activedescendant", cbIndex >= 0 ? "cb-0" : "");
  }
  function comboClose(){ const l = $("#cb-list"), i = $("#cb-in"); if (l) l.hidden = true; if (i) { i.setAttribute("aria-expanded", "false"); i.removeAttribute("aria-activedescendant"); } }
  function comboKey(e){
    const list = $("#cb-list");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (list.hidden) return comboOpen(e.target.value);
      if (!cbItems.length) return;
      cbIndex = (cbIndex + (e.key === "ArrowDown" ? 1 : -1) + cbItems.length) % cbItems.length;
      $$('[role=option]', list).forEach((o, i) => o.setAttribute("aria-selected", i === cbIndex));
      e.target.setAttribute("aria-activedescendant", "cb-" + cbIndex);
      const o = $("#cb-" + cbIndex); if (o) o.scrollIntoView({block: "nearest"});
    } else if (e.key === "Enter") { e.preventDefault(); if (!list.hidden && cbItems[cbIndex]) pickReply(cbItems[cbIndex].id); }
    else if (e.key === "Escape") comboClose();
  }
  function pickReply(id){
    const text = $("#rp-text") ? $("#rp-text").value : "";
    REPLY_TO = id; render(false);
    const ta = $("#rp-text"); if (ta) { ta.value = text; ta.focus(); }
  }
  document.addEventListener("focusin", e => { if (e.target.id === "cb-in") comboOpen(e.target.value); });
  document.addEventListener("mousedown", e => { const o = e.target.closest && e.target.closest("[data-pick]"); if (o) { e.preventDefault(); pickReply(o.dataset.pick); } });
  document.addEventListener("click", e => { if (!e.target.closest || !e.target.closest("#combo")) comboClose(); }, true);

  async function upload(input){
    const f = input.files[0], kind = input.dataset.kind;
    if (f.size > 4 * 1024 * 1024) { toast("This file is larger than 4 MB. Please upload a smaller PDF."); input.value = ""; return; }
    const label = input.closest("label"); label.setAttribute("aria-busy", "true"); label.style.opacity = ".6";
    const fd = new FormData(); fd.append("kind", kind); fd.append("file", f, f.name);
    try {
      await api("/api/me/files", {form: fd});
      toast((kind === "cv" ? "CV" : "LinkedIn PDF") + " uploaded. We refresh your facts in the next daily run.");
      S.profile = await api("/api/me/profile");
      if (PDRAFT) { PDRAFT.files = S.profile.files; PDRAFT.facts_pending = S.profile.facts_pending; }
      render(false);
    } catch (err) { if (!/signed_out|no_account/.test(err.message)) toast(err.message); label.style.opacity = ""; label.removeAttribute("aria-busy"); }
    input.value = "";
  }

  document.addEventListener("click", async e => {
    const tr = e.target.closest && e.target.closest("tr[data-href]");
    if (tr && !e.target.closest("a")) { location.hash = tr.dataset.href; return; }
    const b = e.target.closest && e.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act, id = b.dataset.id, p = id ? person(id) : null;
    const fail = err => { b.disabled = false; if (!/signed_out|no_account/.test(err.message)) toast(err.message); };
    const go = async (path, body, msg, after) => {
      b.disabled = true;
      try { await api(path, {body: body}); if (msg) toast(msg); if (after) await after(); await refresh(); } catch (err) { fail(err); }
    };
    const P = "/api/me/prospects/" + encodeURIComponent(id || "");
    switch (act) {
      case "logout": return signOut(false);
      case "edit": EDITING[id] = p.draft.body; render(false); { const t = $("#d-" + CSS.escape(id)); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } } return;
      case "cancel": delete EDITING[id]; render(false); { const x = $('[data-act="edit"][data-id="' + CSS.escape(id) + '"]'); if (x) x.focus(); } return;
      case "save": {
        const text = (EDITING[id] || "").trim();
        if (!text) return toast("The message is empty. Write something or press Cancel.");
        return go(P + "/approve", {body: text}, "Edit saved. Copy it when you are ready.", () => { delete EDITING[id]; });
      }
      case "copy": {
        const txt = EDITING[id] != null ? EDITING[id] : p.draft.body;
        return copy(txt).then(() => toast("Copied. Paste it into LinkedIn."), () => { const t = $("#d-" + CSS.escape(id)); if (t) { t.removeAttribute("readonly"); t.select(); } toast("Select the message and copy it by hand."); });
      }
      case "sent": {
        b.disabled = true;
        const edited = EDITING[id] != null ? EDITING[id].trim() : null;
        try {
          await api(P + "/sent", {body: edited ? {body: edited} : {}});
          delete EDITING[id];
          if (parseRoute().name === "send") await collapse($("#p-" + CSS.escape(id)));
          toast("Marked as sent to " + p.name + ".");
          await refresh();
          const nx = $("#view .card h3 a"); if (nx && parseRoute().name === "send") nx.focus(); else { const h = $("#vh"); if (h) h.focus(); }
        } catch (err) { fail(err); }
        return;
      }
      case "skip": {
        if (!(await confirmSkip(p))) return;
        return go(P + "/skip", {}, p.name + " will not be contacted.");
      }
      case "reply": {
        const ta = $("#r-text"), val = ta ? ta.value.trim() : "";
        if (!val) { toast("Paste their reply first."); if (ta) ta.focus(); return; }
        return go(P + "/reply", {text: val}, "Reply saved. Your next message is being written.");
      }
      case "reply-any": {
        const ta = $("#rp-text"), val = ta ? ta.value.trim() : "";
        if (!REPLY_TO) { toast("Choose who replied first."); const i = $("#cb-in"); if (i) i.focus(); return; }
        if (!val) { toast("Paste their reply first."); if (ta) ta.focus(); return; }
        const who = person(REPLY_TO);
        b.disabled = true;
        try { await api("/api/me/prospects/" + encodeURIComponent(REPLY_TO) + "/reply", {body: {text: val}}); toast("Saved " + first(who.name) + "'s reply. Your answer is being written."); REPLY_TO = null; await refresh(); }
        catch (err) { fail(err); }
        return;
      }
      case "unpick": REPLY_TO = null; render(false); { const i = $("#cb-in"); if (i) i.focus(); } return;
      case "outcome": {
        const sel = $('input[name="outcome"]:checked');
        if (!sel) return toast("Choose an update first.");
        const words = {no_response: "Closed. We will not follow up.", declined: "Noted. Thank you for letting us know.", referral: "A referral. Well done.", interview: "An interview. Well done.", offer: "An offer. Congratulations."};
        return go(P + "/status", {status: sel.value}, words[sel.value] || "Update saved.");
      }
      case "clear-filters": FILTER = {q: "", company: "", type: "", status: ""}; history.replaceState(null, "", "#/people"); render(false); { const q = $("#f-q"); if (q) q.focus(); } return;
      case "untag": { const list = PDRAFT[TAGS[b.dataset.key]]; const v = list.splice(Number(b.dataset.i), 1)[0]; if (b.dataset.key === "companies") PDRAFT.top_companies = PDRAFT.top_companies.filter(x => x.toLowerCase() !== String(v).toLowerCase()); render(false); const i = $("#t-" + b.dataset.key); if (i) i.focus(); return; }
      case "toptoggle": {
        const name = PDRAFT.target_companies[Number(b.dataset.i)], low = name.toLowerCase(), has = PDRAFT.top_companies.some(x => x.toLowerCase() === low);
        if (!has && PDRAFT.top_companies.length >= 10) return toast("Up to 10 top companies. Remove one first.");
        PDRAFT.top_companies = has ? PDRAFT.top_companies.filter(x => x.toLowerCase() !== low) : PDRAFT.top_companies.concat([name]);
        render(false); const again = $('[data-act="toptoggle"][data-i="' + b.dataset.i + '"]'); if (again) again.focus(); return;
      }
      case "discard": PDRAFT = null; render(false); toast("Changes discarded."); return;
      case "psave": {
        const body = patchBody(PDRAFT);
        if (!body.target_roles.length) return toast("Keep at least one target role.");
        if (!body.target_companies.length) return toast("Keep at least one target company.");
        b.disabled = true;
        try {
          const r = await api("/api/me/profile", {method: "PATCH", body: body});
          S.profile = r.profile; PDRAFT = null;
          const q = r.research_queued || [];
          toast(q.length ? "Saved. Research for " + (q.length > 2 ? q.slice(0, 2).join(", ") + " and " + (q.length - 2) + " more" : q.join(" and ")) + " starts in the next daily run." : "Saved. Your next messages use these changes.");
          await refresh();
        } catch (err) { fail(err); }
        return;
      }
    }
  });

  // ---------- boot ----------
  async function boot(){
    $("#shell").hidden = false;
    render(true);
    let cfg = {};
    try { cfg = await (await fetch("/api/public-config", {cache: "no-store"})).json(); } catch (e) {}
    if (!cfg.supabase_url || !cfg.supabase_key || !window.supabase) {
      return stateScreen("Sign-in is not available right now", '<p>Please reload the page in a minute. If it keeps happening, write to <a href="mailto:hello@knock.careers">hello@knock.careers</a>.</p>', '<button class="btn" type="button" onclick="location.reload()">Reload</button>');
    }
    sb = window.supabase.createClient(cfg.supabase_url, cfg.supabase_key, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit"}});
    const fromLink = /error_description=([^&]+)/.exec(location.hash) || /error_description=([^&]+)/.exec(location.search);
    const r = await sb.auth.getSession();                 // waits for a magic-link session in the URL, if any
    if (/access_token|error_description|type=magiclink/.test(location.hash) || location.search) history.replaceState(null, "", location.pathname + "#/home");
    if (!r.data || !r.data.session) {
      if (fromLink) return stateScreen("That sign-in link did not work", '<p>' + esc(decodeURIComponent(fromLink[1].replace(/\+/g, " "))) + '. Links work once and expire after a while. Request a new code to sign in.</p>', '<a class="btn" href="/login">Get a new code</a>');
      return location.replace("/login");
    }
    sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") location.replace("/login"); });
    try { await loadCore(); render(true); }
    catch (err) {
      if (/signed_out|no_account/.test(err.message)) return;
      stateScreen("We could not open your account", '<p>Please check your connection and reload. If it keeps happening, write to <a href="mailto:hello@knock.careers">hello@knock.careers</a>.</p>', '<button class="btn" type="button" onclick="location.reload()">Reload</button>');
    }
  }
  boot();
})();
</script>
</body>
</html>
