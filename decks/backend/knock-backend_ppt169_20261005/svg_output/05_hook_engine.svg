<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="en" font-family="Times New Roman" data-pptx-page-role="content">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#0E1F3A"/></marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#EEF3F8"/>
  <g id="header" data-pptx-bounds="64 44 1090 112" font-family="Arial" font-weight="bold">
    <text x="64" y="60" font-size="13" fill="#4A5F80">HOOK ENGINE</text>
    <text x="64" y="102" font-size="34" fill="#0E1F3A">A hook exists only if two real facts prove it, and<tspan x="64" dy="40">four weighted scores decide which one is used</tspan></text>
  </g>
  <g id="page-stamp" data-pptx-bounds="1166 24 64 76">
    <rect x="1172" y="30" width="52" height="64" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.28" stroke-width="1"/>
    <rect x="1178" y="36" width="40" height="52" fill="#B3301B"/>
    <text x="1198" y="70" font-family="Arial" font-weight="bold" font-size="22" fill="#FAFCFE" text-anchor="middle">5</text>
  </g>
  <line id="perf" data-pptx-role="decoration" x1="64" y1="166" x2="1216" y2="166" stroke="#97B9DD" stroke-width="3" stroke-dasharray="2,7"/>

  <g id="left-heading" data-pptx-bounds="64 182 500 28" font-family="Arial" font-weight="bold" fill="#0E1F3A">
    <text x="64" y="200" font-size="17">How a hook is built (the facts here are illustrative)</text>
  </g>
  <g id="fact-candidate" data-pptx-bounds="64 214 240 150">
    <rect x="64" y="214" width="240" height="150" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <text x="80" y="240" font-family="Arial" font-weight="bold" font-size="13" fill="#4A5F80">CANDIDATE FACT  c:3</text>
    <text x="80" y="266" font-size="17" fill="#0E1F3A">Moved from consumer<tspan x="80" dy="23">brands into product in</tspan><tspan x="80" dy="23">2024.</tspan></text>
  </g>
  <g id="fact-prospect" data-pptx-bounds="324 214 240 150">
    <rect x="324" y="214" width="240" height="150" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <text x="340" y="240" font-family="Arial" font-weight="bold" font-size="13" fill="#4A5F80">PROSPECT FACT  p:rahul:1</text>
    <text x="340" y="266" font-size="17" fill="#0E1F3A">Moved from Flipkart<tspan x="340" dy="23">(category manager) to</tspan><tspan x="340" dy="23">Zepto (product manager)</tspan><tspan x="340" dy="23">in 2024.</tspan></text>
  </g>
  <g id="hook-links" data-pptx-bounds="184 364 260 48">
    <line x1="184" y1="366" x2="184" y2="410" stroke="#0E1F3A" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="444" y1="366" x2="444" y2="410" stroke="#0E1F3A" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <g id="hook-card" data-pptx-bounds="64 412 500 240">
    <rect x="64" y="412" width="500" height="240" fill="#FAFCFE" stroke="#0E1F3A" stroke-width="2"/>
    <rect x="64" y="412" width="500" height="38" fill="#0E1F3A"/>
    <text x="80" y="437" font-family="Arial" font-weight="bold" font-size="16" fill="#FAFCFE">HOOK  ·  similar_transition</text>
    <text x="80" y="488" font-size="18" fill="#2B4266">One line on why these two people have a real reason to<tspan x="80" dy="24">talk.</tspan></text>
    <text x="80" y="548" font-family="Arial" font-size="15" fill="#0E1F3A">candidate_fact_id   c:3<tspan x="80" dy="22">prospect_fact_id    p:rahul:1</tspan></text>
    <line x1="80" y1="590" x2="548" y2="590" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <text x="80" y="628" font-family="Arial" font-weight="bold" font-size="26" fill="#0E1F3A">No citation, no hook.</text>
  </g>

  <g id="right-heading" data-pptx-bounds="620 182 596 28" font-family="Arial" font-weight="bold" fill="#0E1F3A">
    <text x="620" y="200" font-size="17">Four scores, rated 1 to 5, one weight each</text>
  </g>
  <g id="tile-specificity" data-pptx-bounds="620 214 288 100">
    <rect x="620" y="214" width="288" height="100" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <text x="636" y="242" font-family="Arial" font-weight="bold" font-size="18" fill="#0E1F3A">Specificity</text>
    <rect x="824" y="226" width="68" height="30" fill="#0E1F3A"/>
    <text x="858" y="247" font-family="Arial" font-weight="bold" font-size="17" fill="#FAFCFE" text-anchor="middle">0.30</text>
    <text x="636" y="274" font-size="16" fill="#2B4266">How concrete and checkable the<tspan x="636" dy="21">overlap is.</tspan></text>
  </g>
  <g id="tile-rarity" data-pptx-bounds="928 214 288 100">
    <rect x="928" y="214" width="288" height="100" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <text x="944" y="242" font-family="Arial" font-weight="bold" font-size="18" fill="#0E1F3A">Rarity</text>
    <rect x="1132" y="226" width="68" height="30" fill="#0E1F3A"/>
    <text x="1166" y="247" font-family="Arial" font-weight="bold" font-size="17" fill="#FAFCFE" text-anchor="middle">0.25</text>
    <text x="944" y="274" font-size="16" fill="#2B4266">How few people share it. A small<tspan x="944" dy="21">team beats a big city.</tspan></text>
  </g>
  <g id="tile-relevance" data-pptx-bounds="620 326 288 100">
    <rect x="620" y="326" width="288" height="100" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <text x="636" y="354" font-family="Arial" font-weight="bold" font-size="18" fill="#0E1F3A">Relevance</text>
    <rect x="824" y="338" width="68" height="30" fill="#0E1F3A"/>
    <text x="858" y="359" font-family="Arial" font-weight="bold" font-size="17" fill="#FAFCFE" text-anchor="middle">0.30</text>
    <text x="636" y="386" font-size="16" fill="#2B4266">How closely it relates to the target<tspan x="636" dy="21">role at this company.</tspan></text>
  </g>
  <g id="tile-recency" data-pptx-bounds="928 326 288 100">
    <rect x="928" y="326" width="288" height="100" fill="#FAFCFE" stroke="#0E1F3A" stroke-opacity="0.2" stroke-width="1"/>
    <text x="944" y="354" font-family="Arial" font-weight="bold" font-size="18" fill="#0E1F3A">Recency</text>
    <rect x="1132" y="338" width="68" height="30" fill="#0E1F3A"/>
    <text x="1166" y="359" font-family="Arial" font-weight="bold" font-size="17" fill="#FAFCFE" text-anchor="middle">0.15</text>
    <text x="944" y="386" font-size="16" fill="#2B4266">How recent the prospect's side is.<tspan x="944" dy="21">The last six months scores highest.</tspan></text>
  </g>
  <g id="formula" data-pptx-bounds="620 438 596 62">
    <rect x="620" y="438" width="596" height="62" fill="#0E1F3A"/>
    <text x="636" y="466" font-family="Arial" font-size="16" fill="#FAFCFE">score = 0.30 × specificity + 0.25 × rarity<tspan x="636" dy="24">+ 0.30 × relevance + 0.15 × recency</tspan></text>
  </g>
  <g id="hook-rules" data-pptx-bounds="620 524 596 108" font-size="17" fill="#2B4266">
    <rect x="620" y="534" width="8" height="8" fill="#0E1F3A"/>
    <text x="636" y="544">Minimum score is 2.5 of 5. Below it the hook is not used.</text>
    <rect x="620" y="560" width="8" height="8" fill="#0E1F3A"/>
    <text x="636" y="570">The top hook is selected; a second one powers the follow-up.</text>
    <rect x="620" y="586" width="8" height="8" fill="#0E1F3A"/>
    <text x="636" y="596">Seven types: shared school, shared employer, similar transition, relevant<tspan x="636" dy="21">work, post reaction, shared geography, shared interest.</tspan></text>
  </g>
  <g id="source" data-pptx-bounds="64 688 760 22" font-family="Arial" font-size="13" fill="#4A5F80">
    <text x="64" y="702">Source: engine/outreach/hooks.py (WEIGHTS, MIN_SCORE, validate), prompts.py FIND_HOOKS</text>
  </g>
</svg>
